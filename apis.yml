aid: menusifu
name: MenuSifu
description: 'MenuSifu is a U.S. restaurant technology company founded in 2014 that builds an all-in-one
  point-of-sale and restaurant operations platform, used by more than 15,000 active restaurants and supported
  from offices in New York, Los Angeles, Houston, Orlando, Silicon Valley and Chicago. The platform spans
  POS terminals and handhelds, self-service kiosks, kitchen display and kitchen-automation systems, electronic
  menus and order-status screens, online ordering, scan-to-order, waitlist and reservations, loyalty,
  coupons and SMS marketing, and analytics and reporting, with direct order integrations into DoorDash,
  Uber Eats, Grubhub, Fantuan and HungryPanda. It is sold alongside an ecosystem of sibling brands — USEZPAY
  (payment processing), MealKeyway (marketing), EZ Capital (restaurant financing), WeFood and ShowTop.
  MenuSifu markets no public developer program: it publishes no API reference, no OpenAPI or other machine-readable
  contract, and no SDKs, and its production host api.menusifu.com rejects every anonymous request.'
