note: >-
  MenuSifu names four software tiers on its public pricing page but publishes a price for
  only one of them. Three of four tiers carry no number: the page routes to a demo-booking
  form instead. Payment processing is sold separately through USEZPAY, MenuSifu's own
  processor, on an "Interchange Plus, no third-party processor markup" basis with rates
  quoted per merchant. Hardware pricing and installation/menu-programming fees are not
  published. There is no API or developer plan of any kind — these are end-user restaurant
  software packages, not API tiers, so there is no published quota, overage or rate limit
  attached to any of them.
